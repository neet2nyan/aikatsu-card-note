const STORE='aikatsuEncoreInventory_v1';let inventory={};try{inventory=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=DATA.cards.slice().sort((a,b)=>a.id-b.id||a.name.localeCompare(b.name,'ja'));const key=c=>c.id+'|'+c.name;
function getType(n){if(/トップス|ブラウス|キャミソール|ボレロ|ジャケット|チューブトップ|ベスト|バレロ/.test(n))return 'トップス';if(/スカート/.test(n))return 'スカート';if(/シューズ|パンプス|ミュール|サンダル/.test(n))return 'シューズ';if(/ブーツ/.test(n))return 'ブーツ';if(/アクセ|リボン|カチューシャ|ペガサス|エミネンス|スワン|ストーリー/.test(n))return 'アクセサリー';if(/ワンピ/.test(n))return 'ワンピース';if(/ショートパンツ|デニムミニ/.test(n))return 'ボトムス';return 'その他'}
function save(){localStorage.setItem(STORE,JSON.stringify(inventory));renderInventory()}
function renderArrays(){const q=$('arraySearch').value.trim().toLowerCase(),chosen=$('arraySelect').value;let html='';DATA.arrays.filter(a=>chosen==='all'||String(a.id)===chosen).forEach(a=>{let entries=a.cards.filter(c=>!q||String(c.id).includes(q)||c.name.toLowerCase().includes(q));if(q&&!entries.length)return;html+=`<article class="arraycard"><div class="arrayhead"><strong>配列 ${a.id}</strong><span class="pill">${a.cards.length}件 · 順番保存</span></div><div class="seq">${entries.map(c=>`<div class="card"><div class="num">${c.id}${c.star?'★':''}</div><div><div class="cardname">${esc(c.name)} ${c.star?'<span class="star">★</span>':''}</div><div class="pos">${c.position}番目</div></div></div>`).join('')}</div></article>`});$('arrayResults').innerHTML=html||'<div class="empty">見つからなかったよ…検索ワードを変えてみてね</div>'}
function renderInventory(){const q=$('invSearch').value.trim().toLowerCase(),t=$('typeFilter').value;const list=cards.filter(c=>(!q||String(c.id).includes(q)||c.name.toLowerCase().includes(q))&&(t==='all'||getType(c.name)===t));const unique=cards.filter(c=>(inventory[key(c)]||0)>0);$('uniqueOwned').textContent=unique.length;$('totalOwned').textContent=unique.reduce((s,c)=>s+(inventory[key(c)]||0),0);$('inventoryResults').innerHTML=list.map(c=>{let n=inventory[key(c)]||0;return `<div class="invrow"><div class="thumb">画像<br>未登録</div><div><div class="invname">${c.id}${c.star?'★':''}: ${esc(c.name)}</div><div class="invmeta">種類：${getType(c.name)} · ブランド：未登録</div><div class="owned">${n>0?'所持中':'未所持'}</div></div><div class="qty"><button data-delta="-1" data-key="${esc(key(c))}">−</button><span>${n}</span><button data-delta="1" data-key="${esc(key(c))}">＋</button></div></div>`}).join('')||'<div class="empty">該当カードがないよ</div>';}
DATA.arrays.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent='配列 '+a.id;$('arraySelect').appendChild(o)});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));}));
$('arraySearch').addEventListener('input',renderArrays);$('arraySelect').addEventListener('change',renderArrays);$('invSearch').addEventListener('input',renderInventory);$('typeFilter').addEventListener('change',renderInventory);$('brandFilter').addEventListener('change',renderInventory);
$('inventoryResults').addEventListener('click',e=>{const b=e.target.closest('button[data-delta]');if(!b)return;const k=b.dataset.key;inventory[k]=Math.max(0,(inventory[k]||0)+Number(b.dataset.delta));if(!inventory[k])delete inventory[k];save()});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,inventory},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aikatsu-inventory-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.inventory||typeof d.inventory!=='object')throw Error();inventory=d.inventory;save();alert('バックアップを読み込んだよ！')}catch(err){alert('読み込めなかったよ。正しいバックアップファイルか確認してね。')}e.target.value=''};
